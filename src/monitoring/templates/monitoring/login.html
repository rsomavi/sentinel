<!DOCTYPE html>
<html>
<head>
    <title>Sentinel - Login</title>
</head>
<body>
    <h1>Sentinel</h1>
    <h2>Login</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Username:</label>
            <input type="text" name="username">
        </p>
        <p>
            <label>Password:</label>
            <input type="password" name="password">
        </p>
        <input type="submit" value="Login">
    </form>
</body>
</html>
